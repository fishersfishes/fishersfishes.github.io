<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resources - Fisher's Fishes</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="Logo.png" />
  
  <link rel="stylesheet" href="styles.css" />

  <style>
    body { font-family: 'Spectral', Georgia, serif; background: #fafafa; font-size: 1.15rem; line-height: 1.8; }
    h1, h2, h3, nav, .social-links, .resource-link { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    main { opacity: 1 !important; transform: none !important; }

    .page-section { max-width: 900px; margin: 4rem auto; padding: 0 2rem; }
    .page-section h2 { font-size: 2.2rem; color: #c92207; text-align: center; margin-bottom: 3rem; letter-spacing: -0.02em; }

    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .resource-card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 15px rgba(72, 18, 4, 0.04);
      border-left: 4px solid #481204;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateX(-20px);
      animation: slideIn 0.6s ease forwards;
    }

    .resource-card:hover {
      transform: translateX(5px);
      box-shadow: 0 10px 25px rgba(72, 18, 4, 0.08);
      border-left-color: #ec670a;
    }

    @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }

    .resource-text { padding-right: 2rem; }
    .resource-text h3 { font-size: 1.4rem; color: #481204; margin: 0 0 0.5rem 0; }
    .resource-text p { color: #555; margin: 0; }

    .resource-link {
      flex-shrink: 0;
      background: rgba(249, 161, 12, 0.1);
      color: #c92207;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1.2rem;
      transition: all 0.2s ease;
    }

    .resource-card:hover .resource-link {
      background: #c92207;
      color: white;
      transform: scale(1.1);
    }

    @media (max-width: 600px) {
      .resource-card { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
      .resource-text { padding-right: 0; }
    }

    /* ============================================================== */
    /* TAPERING FADE EFFECT                                  */
    /* ============================================================== */
    
    header {
      /* Keeps it solid brown all the way past the icons (88%), then fades cleanly to the off-white page background */
      background: linear-gradient(to bottom, #481204 0%, #481204 93%, #fafafa 100%) !important;
      box-shadow: none !important;
    }

    #boids-container {
      /* Fades the boids out smoothly just before the background starts turning white */
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 95%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 95%);
    }
  </style>
</head>

<body>
  <header style="height: auto; min-height: 450px; padding: 2rem 1rem 7rem 1rem; position: relative;">
    <div id="boids-container"></div>
    <div class="header-content">
      <img src="Logo.png" alt="Fisher's Fishes Logo" style="width: 100px; height: auto;" />
      <h1 style="margin-top: 1rem;">Fisher's Fishes</h1>
      
      <nav>
        <a href="index_rough.html">Home</a>
        <a href="activities.html">Activities</a>
        <a href="resources.html" style="color: #f9a10c;">Resources</a>
        <a href="articles.html">Articles</a>
        <a href="team.html">Team</a>
      </nav>
    </div>
    
    <div class="social-links" style="position: absolute; bottom: 5rem; width: 100%; display: flex; justify-content: center; gap: 1.5rem;">
      <a href="https://www.youtube.com/@FishersFishes" class="youtube" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://bsky.app/profile/fishersfishes.bsky.social" class="bluesky" target="_blank"><i class="fa-brands fa-bluesky"></i></a>
      <a href="https://groups.google.com/u/0/g/fishers-fishes-seminars" class="google-groups" style="background: rgba(249, 161, 12, 0.7);" target="_blank">
        <img src="icons/Google_Groups_icon.png" alt="Google Groups" style="width: 22px; height: 22px; object-fit: contain; filter: brightness(0) invert(1);" />
      </a>
    </div>
  </header>

  <main>
    <section class="page-section">
      <h2>Community Resources</h2>
      <div id="resources-container" class="resource-list">
        <p style="text-align: center; width: 100%;">Loading resources...</p>
      </div>
    </section>
  </main>
  
  <footer>
    <p>&copy; 2026 Fisher's Fishes | Theoretical Biology Club</p>
  </footer>

  <script src="js/boids.js"></script>
  <script>
    async function loadResources() {
      const container = document.getElementById('resources-container');
      try {
        const response = await fetch('data/resources.json');
        const data = await response.json();
        container.innerHTML = '';
        
        data.forEach((resource, index) => {
          const delay = (index * 0.1) + 's';
          const card = document.createElement('div');
          card.className = 'resource-card';
          card.style.animationDelay = delay;
          
          card.innerHTML = `
            <div class="resource-text">
              <h3>${resource.title}</h3>
              <p>${resource.short_description}</p>
            </div>
            <a href="${resource.link}" target="_blank" class="resource-link" aria-label="Open Link">
              <i class="fas fa-external-link-alt"></i>
            </a>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        container.innerHTML = '<p style="text-align: center; width: 100%;">Failed to load resources.</p>';
      }
    }
    document.addEventListener('DOMContentLoaded', loadResources);
  </script>
</body>
</html>
